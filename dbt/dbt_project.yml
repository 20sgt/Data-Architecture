# This is dbt's main settings file. It names the project, points dbt at the
# connection settings, and says where each table should be built.

name: 'sf_legislation'
version: '1.0.0'
config-version: 2

# The name of the connection block dbt should use (defined in profiles.yml).
profile: 'sf_legislation'

# Where dbt looks for each kind of file. These are the standard locations —
# you rarely change them.
model-paths: ["models"]       # the SQL files that build our tables/views
macro-paths: ["macros"]       # reusable snippets of SQL (like our surrogate-key helper)
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

# Folders dbt is allowed to wipe and regenerate (compiled SQL, downloaded packages).
clean-targets:
  - "target"
  - "dbt_packages"

# How our tables get built.
# We put our SQL files into two folders and set a rule for each:
#   models/staging  -> land in the `silver` schema  (the cleaned/flattened tables)
#   models/gold     -> land in the `gold` schema    (the final star schema)
# "materialized: table" means "build a real, stored table" (a view would be
# recomputed every time it's queried instead). We start with plain tables
# everywhere; later we switch the biggest ones to update-only ("incremental").
models:
  sf_legislation:
    # Copy the descriptions from schema.yml into Unity Catalog as table/column
    # COMMENTs on every run. Without this the descriptions live only in dbt docs,
    # and anyone browsing Catalog Explorer — which is where a teammate actually
    # looks first — still sees bare column names.
    +persist_docs:
      relation: true
      columns: true

    staging:
      +schema: silver
      +materialized: table
    intermediate:
      +schema: silver
      +materialized: view      # saved queries (dedup steps), not stored data copies
    gold:
      +schema: gold
      +materialized: table
      # Read access for teammates. Unity Catalog denies by default, so before this
      # existed only workspace admins could query gold — a teammate with a login
      # still got a permission error.
      #
      # Applied by dbt on EVERY run, which matters: a rebuilt table is a new object
      # and would otherwise silently lose its grants. Gold only — silver and
      # intermediate stay internal so nobody builds on a staging table we may
      # restructure without notice.
      #
      # NOT sufficient on its own: reading a table also needs USE CATALOG on the
      # catalog and USE SCHEMA on the schema, which dbt does not manage. Those are
      # granted once, out of band; see CHANGELOG for the two statements.
      #
      # `account users`, not `users`. Unity Catalog resolves principals at the
      # ACCOUNT level, so the workspace-local `users` group is invisible to it and
      # GRANT fails with PRINCIPAL_DOES_NOT_EXIST. `account users` = every user in
      # the Databricks account.
      +grants:
        select: ['account users']
